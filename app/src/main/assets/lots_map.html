<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="leaflet/leaflet.css">
<script src="leaflet/leaflet.js"></script>
<style>html,body,#map{margin:0;height:100%;background:#222}</style>
</head><body>
<div id="map"></div>
<script>
// LotMapActivity 注入：window.__lots = [{id,name,lat,lng,hasCode}], window.__center={lat,lng}
var lots = window.__lots || [];
var c = window.__center || {lat: 22.543, lng: 114.058};
var map = L.map('map').setView([c.lat, c.lng], 13);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

lots.forEach(function(l) {
  var color = l.hasCode ? '#2f6fed' : '#e8883a';   // 蓝=有码 橙=缺码
  var m = L.circleMarker([l.lat, l.lng], {
    radius: 10, color: '#fff', weight: 2, fillColor: color, fillOpacity: 0.95
  }).addTo(map);
  m.bindTooltip(l.name + (l.hasCode ? '' : '（缺码）'), {direction: 'top'});
  m.on('click', function() { if (window.Bridge) Bridge.onLotTap(l.id, l.name); });
});
function jumpTo(lat, lng, zoom) { map.setView([lat, lng], zoom || 15); }
</script>
</body></html>
